[package]
name = "rb_tokenizer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Enable serde Serialize/Deserialize derives on public types.
serde = ["dep:serde", "rb_common/serde"]

[dependencies]
regex = "1.10.3"
rb_common = { path = "../rb_common" }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "tokenizer_bench"
harness = false
