[package]
name = "rb_parser"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Enable serde Serialize/Deserialize derives on public types.
serde = ["dep:serde", "rb_common/serde", "rb_tokenizer/serde"]

[dependencies]
indexmap = "2"
serde = { version = "1", features = ["derive"], optional = true }

[dependencies.rb_common]
path = "../rb_common"

[dependencies.rb_tokenizer]
path = "../rb_tokenizer"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = { version = "1" }

[[bench]]
name = "parser_bench"
harness = false
